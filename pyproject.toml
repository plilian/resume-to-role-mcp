[project]
name = "career-compass-mcp"
version = "0.1.0"
description = "Local-first AI job discovery and ranking across multiple resumes, with job-tailored resumes, cover letters, and batch application workflows"
readme = "README.md"
keywords = ["mcp", "agent-skill", "job-search", "career-tools", "resume", "cover-letter", "job-matching", "multilingual"]
requires-python = ">=3.11"
dependencies = [
  "mcp==2.0.0",
  "httpx>=0.27,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "reportlab>=4,<5",
  "beautifulsoup4>=4.12,<5",
  "arabic-reshaper>=3,<4",
  "python-bidi>=0.6,<1",
]

[project.scripts]
career-compass-mcp = "career_compass_mcp.server:main"

[project.urls]
Homepage = "https://github.com/plilian/resume-to-role-mcp"
Repository = "https://github.com/plilian/resume-to-role-mcp"
Issues = "https://github.com/plilian/resume-to-role-mcp/issues"

[dependency-groups]
dev = ["pytest>=8,<9", "anyio>=4,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/career_compass_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
