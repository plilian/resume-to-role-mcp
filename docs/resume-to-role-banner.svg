<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Resume-to-Role</title>
  <desc id="desc">An AI job search agent that finds roles for your target titles, ranks them across every imported resume, creates job-specific resumes and cover letters, and sends requested application batches.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101B35"/>
      <stop offset="1" stop-color="#173C59"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#52D6C7"/>
      <stop offset="1" stop-color="#F5C66B"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#D8E8F2" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1200" height="370" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="370" rx="28" fill="url(#dots)"/>
  <circle cx="1050" cy="70" r="180" fill="#55D2C4" opacity=".055"/>
  <circle cx="1115" cy="265" r="145" fill="#F5C66B" opacity=".045"/>

  <g transform="translate(68 63)">
    <circle cx="45" cy="45" r="40" fill="#203B59" stroke="#52D6C7" stroke-width="2"/>
    <circle cx="45" cy="45" r="27" fill="none" stroke="#7BE1D6" stroke-width="1.5" opacity=".8"/>
    <path d="M45 10 53 40 82 45 53 50 45 80 37 50 8 45 37 40Z" fill="url(#accent)"/>
    <circle cx="45" cy="45" r="4" fill="#F8FBFF"/>
  </g>

  <text x="172" y="115" fill="#F6FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="49" font-weight="750" letter-spacing="-1.4">Resume-to-Role</text>
  <text x="174" y="159" fill="#B9D1DF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="450">Your all-resume AI job search &amp; application agent</text>
  <rect x="174" y="184" width="455" height="3" rx="2" fill="url(#accent)"/>
  <text x="174" y="226" fill="#E4EFF5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Find &amp; rank jobs using your full resume library</text>
  <text x="174" y="253" fill="#E4EFF5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Tailor each resume &amp; letter · Apply in batches of five</text>

  <g transform="translate(174 291)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing=".7">
    <rect width="48" height="27" rx="13.5" fill="#214B5A" stroke="#52D6C7" stroke-opacity=".55"/><text x="24" y="18" text-anchor="middle" fill="#8CEADF">MCP</text>
    <rect x="58" width="69" height="27" rx="13.5" fill="#214B5A" stroke="#52D6C7" stroke-opacity=".55"/><text x="92.5" y="18" text-anchor="middle" fill="#8CEADF">SKILL</text>
    <rect x="137" width="78" height="27" rx="13.5" fill="#34465A" stroke="#D6E2EB" stroke-opacity=".35"/><text x="176" y="18" text-anchor="middle" fill="#DCE7EF">4 LANGUAGES</text>
    <rect x="225" width="154" height="27" rx="13.5" fill="#34465A" stroke="#D6E2EB" stroke-opacity=".35"/><text x="302" y="18" text-anchor="middle" fill="#DCE7EF">MULTI-HOST · LOCAL-FIRST</text>
  </g>

  <g transform="translate(788 74)">
    <path d="M40 132 C100 132 100 87 160 87 S222 132 280 132 S341 177 400 177" fill="none" stroke="#5CCFC3" stroke-width="3" stroke-dasharray="4 8" opacity=".8"/>
    <path d="M40 132 C100 132 100 87 160 87 S222 132 280 132 S341 177 400 177" fill="none" stroke="#5CCFC3" stroke-width="12" opacity=".08"/>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
      <g transform="translate(40 132)"><circle r="33" fill="#193951" stroke="#53D5C7" stroke-width="2"/><path d="M-11 2a13 13 0 1 1 4 9l-4 8m0-8h11m-11 0V2" fill="none" stroke="#8DE5DA" stroke-width="2.3" stroke-linecap="round"/><text y="61" fill="#DDEAF1" font-size="12" font-weight="650">DISCOVER</text></g>
      <g transform="translate(160 87)"><circle r="33" fill="#193951" stroke="#53D5C7" stroke-width="2"/><circle r="14" fill="none" stroke="#8DE5DA" stroke-width="2"/><path d="M0-20v8m0 24v8m20-20h-8m-24 0h-8m34-14-6 6m-16 16-6 6m28 0-6-6M-14-14l6 6" stroke="#8DE5DA" stroke-width="2"/><circle r="4" fill="#F5C66B"/><text y="61" fill="#DDEAF1" font-size="12" font-weight="650">MATCH</text></g>
      <g transform="translate(280 132)"><circle r="33" fill="#193951" stroke="#53D5C7" stroke-width="2"/><path d="M-11-13h18l8 8v23h-26zM7-13v9h8m-20 1h14m-14 6h14m-14 6h9" fill="none" stroke="#8DE5DA" stroke-width="2" stroke-linejoin="round"/><text y="61" fill="#DDEAF1" font-size="12" font-weight="650">TAILOR</text></g>
      <g transform="translate(400 177)"><circle r="33" fill="#193951" stroke="#F5C66B" stroke-width="2"/><path d="m-13 1 9 9 19-21" fill="none" stroke="#F5C66B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text y="61" fill="#DDEAF1" font-size="12" font-weight="650">PREPARE</text></g>
    </g>
  </g>
</svg>
